name: Focus Metronome (macOS build)

on:
  push:
    paths:
      - "FocusMetronome/**"
      - ".github/workflows/focus-metronome.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: FocusMetronome
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: xcrun swiftc --version
      - name: Scheduler tests
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build.sh
      - name: Check bundle
        run: |
          plutil -lint build/FocusMetronome.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" build/FocusMetronome.app/Contents/Info.plist
          lipo -archs build/FocusMetronome.app/Contents/MacOS/FocusMetronome
          ls -la build/FocusMetronome.app/Contents/Resources
      - name: Menu bar screenshot
        run: |
          open build/FocusMetronome.app
          sleep 6
          pgrep -x FocusMetronome && echo "running" || echo "NOT RUNNING"
          screencapture -x build/screen.png || true
          sips -c 60 4000 --cropOffset 0 0 build/screen.png --out build/menubar.png || true
          W=$(sips -g pixelWidth build/screen.png | awk '/pixelWidth/{print $2}')
          sips -c 50 700 --cropOffset 0 $((W-700)) build/screen.png --out build/right.png
          echo "SCREEN_WIDTH=$W"
          echo "BEGIN_PNG"; base64 -i build/right.png | fold -w 1000; echo "END_PNG"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            FocusMetronome/build/screen.png
            FocusMetronome/build/menubar.png
      - name: Zip
        run: ditto -c -k --keepParent build/FocusMetronome.app build/FocusMetronome.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FocusMetronome
          path: FocusMetronome/build/FocusMetronome.zip
